<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virtual Trading Terminal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin:0; background:#020617; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const STOCK_SEED = [
  { symbol: "RELIANCE", name: "Reliance Industries", price: 2940 },
  { symbol: "TCS", name: "Tata Consultancy Services", price: 3850 },
  { symbol: "HDFCBANK", name: "HDFC Bank", price: 1780 },
  { symbol: "INFY", name: "Infosys", price: 1620 },
  { symbol: "ICICIBANK", name: "ICICI Bank", price: 1265 },
  { symbol: "HINDUNILVR", name: "Hindustan Unilever", price: 2410 },
  { symbol: "SBIN", name: "State Bank of India", price: 845 },
  { symbol: "BHARTIARTL", name: "Bharti Airtel", price: 1620 },
  { symbol: "KOTAKBANK", name: "Kotak Mahindra Bank", price: 1980 },
  { symbol: "ITC", name: "ITC Ltd", price: 465 },
  { symbol: "LT", name: "Larsen & Toubro", price: 3620 },
  { symbol: "AXISBANK", name: "Axis Bank", price: 1195 },
  { symbol: "BAJFINANCE", name: "Bajaj Finance", price: 7250 },
  { symbol: "ASIANPAINT", name: "Asian Paints", price: 2510 },
  { symbol: "MARUTI", name: "Maruti Suzuki", price: 12400 },
  { symbol: "WIPRO", name: "Wipro", price: 295 },
  { symbol: "ONGC", name: "Oil & Natural Gas Corp", price: 265 },
  { symbol: "TATAMOTORS", name: "Tata Motors", price: 980 },
  { symbol: "SUNPHARMA", name: "Sun Pharma", price: 1780 },
  { symbol: "TITAN", name: "Titan Company", price: 3390 },
];

const STORAGE_KEY = "vtrade-state-v1";
const FUND_PRESETS = [100, 500, 1000, 5000, 10000];

function seedHistory(base) {
  const arr = [];
  let p = base;
  for (let i = 0; i < 20; i++) {
    p = p * (1 + (Math.random() - 0.5) * 0.002);
    arr.push(p);
  }
  return arr;
}

function fmtINR(n) {
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
}
function fmtINRShort(n) {
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
}

// Lightweight inline icons (no external icon library needed)
const Icon = {
  up: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>,
  down: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>,
  search: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>,
  briefcase: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
  clock: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>,
  wallet: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h3v-4z"/></svg>,
  back: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>,
  plus: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
  x: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>,
  rupee: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 3h12M6 8h12M6 3c4 0 7 2 7 5s-3 5-7 5h9M6 13l8 8"/></svg>,
};

function Sparkline({ history, positive, width = 64, height = 32 }) {
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  const points = history.map((p, i) => {
    const x = (i / (history.length - 1)) * width;
    const y = height - ((p - min) / range) * height;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg width={width} height={height}>
      <polyline points={points} fill="none" stroke={positive ? "#34d399" : "#f43f5e"} strokeWidth="1.5" />
    </svg>
  );
}

function BigChart({ history, positive }) {
  const width = 340, height = 140;
  const min = Math.min(...history);
  const max = Math.max(...history);
  const range = max - min || 1;
  const points = history.map((p, i) => {
    const x = (i / (history.length - 1)) * width;
    const y = height - ((p - min) / range) * height;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="160" preserveAspectRatio="none">
      <polyline points={points} fill="none" stroke={positive ? "#34d399" : "#f43f5e"} strokeWidth="2" />
    </svg>
  );
}

function App() {
  const [loaded, setLoaded] = useState(false);
  const [balance, setBalance] = useState(0);
  const [holdings, setHoldings] = useState({});
  const [orders, setOrders] = useState([]);
  const [stocks, setStocks] = useState(() =>
    STOCK_SEED.reduce((acc, s) => {
      const history = seedHistory(s.price);
      acc[s.symbol] = { name: s.name, price: history[history.length - 1], dayOpen: s.price, history };
      return acc;
    }, {})
  );

  const [tab, setTab] = useState("watchlist");
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState("");
  const [showFunds, setShowFunds] = useState(false);
  const [customFund, setCustomFund] = useState("");
  const [tradeQty, setTradeQty] = useState("1");
  const [toast, setToast] = useState(null);

  // Load persisted state from localStorage
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setBalance(parsed.balance ?? 0);
        setHoldings(parsed.holdings ?? {});
        setOrders(parsed.orders ?? []);
      }
    } catch (e) { /* no saved state yet */ }
    setLoaded(true);
  }, []);

  // Persist on change
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ balance, holdings, orders }));
    } catch (e) { console.error("save failed", e); }
  }, [balance, holdings, orders, loaded]);

  // Simulated live tick
  useEffect(() => {
    const id = setInterval(() => {
      setStocks((prev) => {
        const next = {};
        for (const sym in prev) {
          const s = prev[sym];
          const drift = (Math.random() - 0.5) * 0.006;
          const newPrice = Math.max(1, s.price * (1 + drift));
          const history = [...s.history.slice(-29), newPrice];
          next[sym] = { ...s, price: newPrice, history };
        }
        return next;
      });
    }, 2500);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  const filteredSymbols = useMemo(() => {
    const q = search.trim().toUpperCase();
    return Object.keys(stocks).filter(
      (sym) => !q || sym.includes(q) || stocks[sym].name.toUpperCase().includes(q)
    );
  }, [search, stocks]);

  const portfolioValue = useMemo(() => {
    return Object.entries(holdings).reduce((sum, [sym, h]) => {
      const price = stocks[sym] ? stocks[sym].price : h.avgPrice;
      return sum + price * h.qty;
    }, 0);
  }, [holdings, stocks]);

  const totalInvested = useMemo(() => {
    return Object.values(holdings).reduce((sum, h) => sum + h.avgPrice * h.qty, 0);
  }, [holdings]);

  const totalPL = portfolioValue - totalInvested;
  const netWorth = balance + portfolioValue;

  function addFunds(amount) {
    if (!amount || amount <= 0) return;
    setBalance((b) => b + amount);
    setToast(`Added ${fmtINRShort(amount)} virtual funds`);
    setShowFunds(false);
    setCustomFund("");
  }

  function placeOrder(symbol, side, qty) {
    qty = Number(qty);
    if (!qty || qty <= 0) return;
    const price = stocks[symbol].price;
    const cost = price * qty;

    if (side === "buy") {
      if (cost > balance) { setToast("Insufficient virtual balance"); return; }
      setBalance((b) => b - cost);
      setHoldings((h) => {
        const existing = h[symbol];
        if (!existing) return { ...h, [symbol]: { qty, avgPrice: price } };
        const newQty = existing.qty + qty;
        const newAvg = (existing.avgPrice * existing.qty + cost) / newQty;
        return { ...h, [symbol]: { qty: newQty, avgPrice: newAvg } };
      });
      setToast(`Bought ${qty} ${symbol} @ ${fmtINR(price)}`);
    } else {
      const existing = holdings[symbol];
      if (!existing || existing.qty < qty) { setToast("Not enough holdings to sell"); return; }
      setBalance((b) => b + cost);
      setHoldings((h) => {
        const remaining = existing.qty - qty;
        const copy = { ...h };
        if (remaining <= 0) delete copy[symbol];
        else copy[symbol] = { ...existing, qty: remaining };
        return copy;
      });
      setToast(`Sold ${qty} ${symbol} @ ${fmtINR(price)}`);
    }

    setOrders((o) => [{ id: Date.now() + Math.random(), symbol, side, qty, price, ts: Date.now() }, ...o]);
  }

  if (!loaded) {
    return <div className="min-h-screen bg-slate-950 flex items-center justify-center text-slate-500 text-sm">Loading simulator…</div>;
  }

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans max-w-md mx-auto relative">
      <div className="px-4 pt-5 pb-3 border-b border-slate-800 bg-slate-950 sticky top-0 z-20">
        {selected ? (
          <button onClick={() => setSelected(null)} className="flex items-center gap-1 text-slate-400 text-sm mb-3">
            <Icon.back className="w-4 h-4" /> Back
          </button>
        ) : (
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="text-xs text-slate-500 tracking-wide uppercase">Virtual Trading</div>
              <div className="text-lg font-semibold text-slate-100">Practice Terminal</div>
            </div>
            <div className="w-8 h-8 rounded-full bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 text-xs font-bold">VT</div>
          </div>
        )}

        {!selected && (
          <div className="rounded-2xl bg-gradient-to-br from-slate-900 to-slate-900/60 border border-slate-800 p-4">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-[11px] text-slate-500 uppercase tracking-wide">Net worth</div>
                <div className="text-2xl font-bold tabular-nums text-slate-50">{fmtINR(netWorth)}</div>
                <div className={`text-xs mt-1 flex items-center gap-1 tabular-nums ${totalPL >= 0 ? "text-emerald-400" : "text-rose-500"}`}>
                  {totalPL >= 0 ? <Icon.up className="w-3.5 h-3.5" /> : <Icon.down className="w-3.5 h-3.5" />}
                  {fmtINR(Math.abs(totalPL))} overall P&L
                </div>
              </div>
              <button onClick={() => setShowFunds(true)} className="flex items-center gap-1 bg-teal-500 hover:bg-teal-400 text-slate-950 text-sm font-semibold px-3 py-2 rounded-xl">
                <Icon.plus className="w-3.5 h-3.5" /> Add funds
              </button>
            </div>
            <div className="flex gap-4 mt-3 pt-3 border-t border-slate-800 text-xs">
              <div><div className="text-slate-500">Cash balance</div><div className="text-slate-200 font-medium tabular-nums">{fmtINR(balance)}</div></div>
              <div><div className="text-slate-500">Invested</div><div className="text-slate-200 font-medium tabular-nums">{fmtINR(totalInvested)}</div></div>
            </div>
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto pb-20">
        {selected ? (
          <StockDetail symbol={selected} stock={stocks[selected]} holding={holdings[selected]} balance={balance}
            tradeQty={tradeQty} setTradeQty={setTradeQty} onTrade={placeOrder} />
        ) : tab === "watchlist" ? (
          <Watchlist symbols={filteredSymbols} stocks={stocks} search={search} setSearch={setSearch}
            onSelect={(sym) => { setSelected(sym); setTradeQty("1"); }} />
        ) : tab === "portfolio" ? (
          <Portfolio holdings={holdings} stocks={stocks} onSelect={setSelected} />
        ) : (
          <Orders orders={orders} />
        )}
      </div>

      {!selected && (
        <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 border-t border-slate-800 flex z-20">
          <NavBtn icon={<Icon.search className="w-[18px] h-[18px]" />} label="Watchlist" active={tab === "watchlist"} onClick={() => setTab("watchlist")} />
          <NavBtn icon={<Icon.briefcase className="w-[18px] h-[18px]" />} label="Portfolio" active={tab === "portfolio"} onClick={() => setTab("portfolio")} />
          <NavBtn icon={<Icon.clock className="w-[18px] h-[18px]" />} label="Orders" active={tab === "orders"} onClick={() => setTab("orders")} />
          <NavBtn icon={<Icon.wallet className="w-[18px] h-[18px]" />} label="Funds" active={false} onClick={() => setShowFunds(true)} />
        </div>
      )}

      {showFunds && (
        <div className="fixed inset-0 bg-black/60 flex items-end z-30" onClick={() => setShowFunds(false)}>
          <div className="bg-slate-900 w-full max-w-md mx-auto rounded-t-3xl p-5 border-t border-slate-700" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <div className="font-semibold text-slate-100">Add virtual funds</div>
              <button onClick={() => setShowFunds(false)} className="text-slate-500"><Icon.x className="w-5 h-5" /></button>
            </div>
            <div className="grid grid-cols-3 gap-2 mb-4">
              {FUND_PRESETS.map((amt) => (
                <button key={amt} onClick={() => addFunds(amt)} className="bg-slate-800 hover:bg-slate-700 rounded-xl py-3 text-sm font-medium text-slate-100">
                  +{fmtINRShort(amt)}
                </button>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <div className="flex-1 flex items-center bg-slate-800 rounded-xl px-3">
                <Icon.rupee className="w-3.5 h-3.5 text-slate-500" />
                <input type="number" value={customFund} onChange={(e) => setCustomFund(e.target.value)}
                  placeholder="Custom amount" className="bg-transparent flex-1 py-3 px-2 text-sm text-slate-100 outline-none" />
              </div>
              <button onClick={() => addFunds(Number(customFund))} className="bg-teal-500 text-slate-950 font-semibold px-4 py-3 rounded-xl text-sm">Add</button>
            </div>
            <div className="text-[11px] text-slate-600 mt-3">This is simulated money. No real payment is involved.</div>
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-100 text-xs px-4 py-2 rounded-full border border-slate-700 z-40 shadow-lg">
          {toast}
        </div>
      )}
    </div>
  );
}

function NavBtn({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className={`flex-1 flex flex-col items-center gap-1 py-2.5 ${active ? "text-teal-400" : "text-slate-500"}`}>
      {icon}<span className="text-[10px]">{label}</span>
    </button>
  );
}

function Watchlist({ symbols, stocks, search, setSearch, onSelect }) {
  return (
    <div className="px-4 pt-3">
      <div className="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-3 mb-3">
        <Icon.search className="w-[15px] h-[15px] text-slate-500" />
        <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search stocks"
          className="bg-transparent flex-1 py-2.5 px-2 text-sm outline-none text-slate-100 placeholder:text-slate-600" />
      </div>
      <div className="divide-y divide-slate-900">
        {symbols.map((sym) => {
          const s = stocks[sym];
          const change = s.price - s.dayOpen;
          const pct = (change / s.dayOpen) * 100;
          const positive = change >= 0;
          return (
            <button key={sym} onClick={() => onSelect(sym)} className="w-full flex items-center justify-between py-3 active:bg-slate-900/60">
              <div className="text-left">
                <div className="text-sm font-medium text-slate-100">{sym}</div>
                <div className="text-[11px] text-slate-500">{s.name}</div>
              </div>
              <Sparkline history={s.history} positive={positive} />
              <div className="text-right w-24">
                <div className="text-sm font-semibold tabular-nums text-slate-100">{fmtINR(s.price)}</div>
                <div className={`text-[11px] tabular-nums ${positive ? "text-emerald-400" : "text-rose-500"}`}>
                  {positive ? "+" : ""}{pct.toFixed(2)}%
                </div>
              </div>
            </button>
          );
        })}
        {symbols.length === 0 && <div className="text-center text-slate-600 text-sm py-10">No stocks match your search.</div>}
      </div>
    </div>
  );
}

function Portfolio({ holdings, stocks, onSelect }) {
  const entries = Object.entries(holdings);
  if (entries.length === 0) {
    return (
      <div className="px-4 pt-16 text-center">
        <Icon.briefcase className="w-8 h-8 mx-auto text-slate-700 mb-3" />
        <div className="text-slate-300 font-medium">No holdings yet</div>
        <div className="text-slate-600 text-sm mt-1">Buy a stock from the watchlist to see it here.</div>
      </div>
    );
  }
  return (
    <div className="px-4 pt-3 divide-y divide-slate-900">
      {entries.map(([sym, h]) => {
        const price = stocks[sym] ? stocks[sym].price : h.avgPrice;
        const pl = (price - h.avgPrice) * h.qty;
        const plPct = ((price - h.avgPrice) / h.avgPrice) * 100;
        const positive = pl >= 0;
        return (
          <button key={sym} onClick={() => onSelect(sym)} className="w-full flex items-center justify-between py-3.5 active:bg-slate-900/60">
            <div className="text-left">
              <div className="text-sm font-medium text-slate-100">{sym}</div>
              <div className="text-[11px] text-slate-500">{h.qty} qty · avg {fmtINR(h.avgPrice)}</div>
            </div>
            <div className="text-right">
              <div className="text-sm font-semibold tabular-nums text-slate-100">{fmtINR(price * h.qty)}</div>
              <div className={`text-[11px] tabular-nums ${positive ? "text-emerald-400" : "text-rose-500"}`}>
                {positive ? "+" : ""}{fmtINR(pl)} ({plPct.toFixed(2)}%)
              </div>
            </div>
          </button>
        );
      })}
    </div>
  );
}
function Orders({ orders }) {
  if (orders.length === 0) {
    return (
      <div className="px-4 pt-16 text-center">
        <Icon.clock className="w-8 h-8 mx-auto text-slate-700 mb-3" />
        <div className="text-slate-300 font-medium">No orders yet</div>
        <div className="text-slate-600 text-sm mt-1">Your buy and sell history will show up here.</div>
      </div>
    );
  }
  return (
    <div className="px-4 pt-3 divide-y divide-slate-900">
      {orders.map((o) => (
        <div key={o.id} className="flex items-center justify-between py-3">
          <div>
            <div className="text-sm font-medium text-slate-100">
              {o.symbol} <span className={o.side === "buy" ? "text-emerald-400" : "text-rose-500"}>{o.side.toUpperCase()}</span>
            </div>
            <div className="text-[11px] text-slate-500">{new Date(o.ts).toLocaleString("en-IN")}</div>
          </div>
          <div className="text-right">
            <div className="text-sm font-medium tabular-nums text-slate-100">{o.qty} qty</div>
            <div className="text-[11px] text-slate-500 tabular-nums">@ {fmtINR(o.price)}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

function StockDetail({ symbol, stock, holding, balance, tradeQty, setTradeQty, onTrade }) {
  const change = stock.price - stock.dayOpen;
  const pct = (change / stock.dayOpen) * 100;
  const positive = change >= 0;
  const qty = Number(tradeQty) || 0;
  const cost = qty * stock.price;

  return (
    <div className="px-4 pt-2">
      <div className="mb-1">
        <div className="text-xl font-bold text-slate-100">{symbol}</div>
        <div className="text-xs text-slate-500">{stock.name}</div>
      </div>
      <div className="flex items-end gap-2 mt-2">
        <div className="text-3xl font-bold tabular-nums text-slate-50">{fmtINR(stock.price)}</div>
        <div className={`text-sm mb-1 tabular-nums ${positive ? "text-emerald-400" : "text-rose-500"}`}>
          {positive ? "+" : ""}{fmtINR(change)} ({pct.toFixed(2)}%)
        </div>
      </div>

      <div className="mt-3">
        <BigChart history={stock.history} positive={positive} />
      </div>

      {holding && (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 mt-2 flex justify-between text-xs">
          <div>
            <div className="text-slate-500">Your holding</div>
            <div className="text-slate-200 font-medium">{holding.qty} qty @ avg {fmtINR(holding.avgPrice)}</div>
          </div>
          <div className="text-right">
            <div className="text-slate-500">Current value</div>
            <div className="text-slate-200 font-medium tabular-nums">{fmtINR(holding.qty * stock.price)}</div>
          </div>
        </div>
      )}

      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mt-4">
        <div className="text-xs text-slate-500 mb-2">Quantity</div>
        <div className="flex items-center gap-2 mb-3">
          <button onClick={() => setTradeQty(String(Math.max(1, qty - 1)))} className="w-9 h-9 rounded-lg bg-slate-800 text-slate-200 font-bold">−</button>
          <input type="number" value={tradeQty} onChange={(e) => setTradeQty(e.target.value)}
            className="flex-1 bg-slate-800 rounded-lg text-center py-2 text-slate-100 outline-none tabular-nums" />
          <button onClick={() => setTradeQty(String(qty + 1))} className="w-9 h-9 rounded-lg bg-slate-800 text-slate-200 font-bold">+</button>
        </div>
        <div className="flex justify-between text-xs text-slate-500 mb-4">
          <span>Est. cost</span><span className="text-slate-300 tabular-nums">{fmtINR(cost)}</span>
        </div>
        <div className="flex gap-2">
          <button onClick={() => onTrade(symbol, "buy", qty)} className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-3 rounded-xl text-sm">Buy</button>
          <button onClick={() => onTrade(symbol, "sell", qty)} disabled={!holding}
            className="flex-1 bg-rose-500 hover:bg-rose-400 disabled:opacity-30 text-slate-950 font-semibold py-3 rounded-xl text-sm">Sell</button>
        </div>
        <div className="text-[11px] text-slate-600 mt-3 text-center">Cash balance: {fmtINR(balance)}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
